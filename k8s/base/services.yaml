apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: crm-platform
  labels:
    app: auth-service
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: auth-service
          image: REGISTRY/auth-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: crm-env
          env:
            - name: PORT
              value: "8001"
            - name: SERVICE_NAME
              value: "auth-service"
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: crm-platform
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
---
