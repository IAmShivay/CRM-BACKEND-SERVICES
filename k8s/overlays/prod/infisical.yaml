apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: crm-env
  namespace: crm-prod
spec:
  hostAPI: INFISICAL_HOST
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: INFISICAL_PROJECT_SLUG
        envSlug: prod
        secretsPath: "/"
        recursive: true
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: crm-prod
  managedKubeSecretReferences:
    - secretName: crm-env
      secretNamespace: crm-prod
      creationPolicy: "Orphan"
