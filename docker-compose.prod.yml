x-service: &service
  env_file: .env
  restart: unless-stopped
  networks:
    - crm
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - crm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-auth-service:${TAG}
    environment:
      - SERVICE_NAME=auth-service
      - PORT=8001

  sales-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-sales-service:${TAG}
    environment:
      - SERVICE_NAME=sales-service
      - PORT=8002

  hr-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-hr-service:${TAG}
    environment:
      - SERVICE_NAME=hr-service
      - PORT=8003

  whatsapp-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-whatsapp-service:${TAG}
    environment:
      - SERVICE_NAME=whatsapp-service
      - PORT=8004

  social-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-social-service:${TAG}
    environment:
      - SERVICE_NAME=social-service
      - PORT=8005

  billing-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-billing-service:${TAG}
    environment:
      - SERVICE_NAME=billing-service
      - PORT=8006

  marketing-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-marketing-service:${TAG}
    environment:
      - SERVICE_NAME=marketing-service
      - PORT=8007

  collaboration-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-collaboration-service:${TAG}
    environment:
      - SERVICE_NAME=collaboration-service
      - PORT=8008

  analytics-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-analytics-service:${TAG}
    environment:
      - SERVICE_NAME=analytics-service
      - PORT=8009

  cms-service:
    <<: *service
    image: ${IMAGE_PREFIX}/crm-cms-service:${TAG}
    environment:
      - SERVICE_NAME=cms-service
      - PORT=8010

  n8n:
    image: docker.n8n.io/n8nio/n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - crm
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-8000}:80"
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - NGINX_ENVSUBST_FILTER=^CORS_ORIGIN_REGEX$$
      - CORS_ORIGIN_REGEX=${CORS_ORIGIN_REGEX:-https?://localhost:300[01]}
    volumes:
      - ./nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
    networks:
      - crm
    depends_on:
      - auth-service
      - sales-service
      - hr-service
      - whatsapp-service
      - social-service
      - billing-service
      - marketing-service
      - collaboration-service
      - analytics-service
      - cms-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE_PREFIX:-${IMAGE_PREFIX}}/crm-sass:${FRONTEND_TAG:-latest}
    environment:
      - API_GATEWAY_URL=http://gateway:80
      - NEXT_PUBLIC_APP_URL=${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - crm
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - crm
    depends_on:
      - gateway
      - frontend
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - crm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  crm:
    name: crm-platform

volumes:
  redis_data:
  n8n_data:
  caddy_data:
  caddy_config:
  minio_data:
