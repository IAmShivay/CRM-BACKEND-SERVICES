events {
    worker_connections 1024;
}

http {
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    map $http_origin $cors_origin {
        default "";
        "~^${CORS_ORIGIN_REGEX}$" $http_origin;
    }

    server {
        listen 80;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auth_service http://auth-service:8001;
        set $sales_service http://sales-service:8002;
        set $hr_service http://hr-service:8003;
        set $whatsapp_service http://whatsapp-service:8004;
        set $social_service http://social-service:8005;
        set $billing_service http://billing-service:8006;
        set $marketing_service http://marketing-service:8007;
        set $collaboration_service http://collaboration-service:8008;
        set $analytics_service http://analytics-service:8009;
        set $cms_service http://cms-service:8010;
        client_max_body_size 20m;
        absolute_redirect off;

        if ($request_method = 'OPTIONS') {
            set $cors_method true;
        }

        location /api/auth {
            proxy_pass $auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Correlation-Id, X-Workspace-Id" always;
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location /api/users {
